name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  compose:
    name: compose config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose file (all profiles + osint override)
        run: |
          cp .env.example .env
          docker compose config -q
          docker compose -f compose.yaml -f osint/compose.yaml --profile '*' config -q
      - name: compose / .env / dashboard / ./ctf in sync
        run: python3 tools/check_consistency.py

  scripts:
    name: shell + tools
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: shellcheck ctf app/tests/ui_smoke.sh tools/lint/run.sh tools/ci_wait.sh
      - name: dork generator self-test
        run: python3 tools/dork/test_dork.py
      - name: tools compile
        run: python3 -m py_compile tools/scan.py tools/stegsuite_client.py tools/check_consistency.py

  lint:
    name: static analysis (ruff, bandit, vulture, jscpd)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: tools/lint/run.sh (containers, pinned versions)
        run: tools/lint/run.sh

  backend:
    name: backend (compile + unit tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install -r app/backend/requirements.txt pytest
      - name: Compile
        run: python -m compileall -q app/backend
      - name: Unit tests
        run: pytest -q app/tests

  frontend:
    name: frontend (build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install
        working-directory: app/frontend
        run: npm ci --no-audit --no-fund
      - name: Build
        working-directory: app/frontend
        run: npm run build

  # L2 (mechanus): the full gate, once per PR and on main. ~3 h, so nobody waits
  # for it: tools/ci_wait.sh polls it and prints the tail of a failed log.
  e2e:
    name: L2 (image + unit with tools + fixtures + real CTFs)
    needs: [lint, backend]
    runs-on: ubuntu-latest
    timeout-minutes: 330
    concurrency:
      group: l2-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - name: Free disk (image is ~5 GB)
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - name: Build image
        run: docker build -f app/Dockerfile -t stegsuite:ci .
      - name: Unit tests inside the image (tshark, zbar, tesseract present)
        run: STEGSUITE_IMAGE=stegsuite:ci app/tests/run_unit.sh -q -p no:cacheprovider
      - name: Start StegSuite
        run: |
          mkdir -p /tmp/ssdata
          docker run -d --name ss -p 127.0.0.1:19014:19014 -v /tmp/ssdata:/data \
            -v "$PWD/wordlists:/wordlists:ro" stegsuite:ci
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:19014/api/v1/health && exit 0
            sleep 2
          done
          docker logs ss; exit 1
      - name: Fixtures
        run: |
          docker cp app/tests/ctf_regression.py ss:/tmp/ctf_regression.py
          docker cp app/tests/fixtures ss:/tmp/fixtures
          docker exec -e FIXTURES_DIR=/tmp/fixtures -e REGRESSION_WAIT_S=900 ss \
            /opt/stegsuite/venv/bin/python /tmp/ctf_regression.py
      - name: Real CTFs (core)
        working-directory: app/tests
        run: PYTHONUNBUFFERED=1 python3 real_challenges.py -j 3
      - name: Real CTFs (extra)
        working-directory: app/tests
        run: PYTHONUNBUFFERED=1 python3 real_challenges.py -j 3 --only-new --extra
      - name: Flags vs write-ups
        working-directory: app/tests
        run: PYTHONUNBUFFERED=1 python3 verify_flags.py
      - name: StegSuite log on failure
        if: failure()
        run: docker logs --tail 200 ss

# CTF Toolbox — tool dockerizzati per risolvere CTF (GUI web)
# Uso rapido:  ./ctf up            (tool core)
#              ./ctf up web        (core + profilo web)
#              ./ctf up-all        (tutto)
#              ./ctf down
#
# Porte host: fascia 19000+ (scelta apposta per non collidere con altri stack).

name: ctf

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # ---------------------------------------------------------------- DASHBOARD
  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    restart: unless-stopped
    mem_limit: 512m
    logging: *default-logging
    ports:
      - "${HOMEPAGE_PORT:-19001}:3000"
    volumes:
      - ./config/homepage:/app/config
      # read-only: Homepage mostra stato/CPU/RAM dei container (integrazione Docker)
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      HOMEPAGE_ALLOWED_HOSTS: ${HOMEPAGE_ALLOWED_HOSTS:-localhost:19001,127.0.0.1:19001}
    networks: [ctfnet]

  # -------------------------------------------------------------- CRYPTO/ENCODING
  cyberchef:
    image: ghcr.io/gchq/cyberchef:latest
    restart: unless-stopped
    mem_limit: 256m
    logging: *default-logging
    ports:
      - "${CYBERCHEF_PORT:-19002}:8080"
    networks: [ctfnet]

  sagemath:
    image: sagemath/sagemath:latest
    restart: unless-stopped
    command: sage-jupyter
    mem_limit: 2g
    cpus: 1.5
    logging: *default-logging
    ports:
      - "${SAGEMATH_PORT:-19010}:8888"
    volumes:
      - sagemath-home:/home/sage
    profiles: [crypto]
    networks: [ctfnet]

  # ------------------------------------------------------------------------------- WEB
  mitmproxy:
    image: mitmproxy/mitmproxy:latest
    restart: unless-stopped
    mem_limit: 512m
    logging: *default-logging
    command: mitmweb --web-host 0.0.0.0 --listen-host 0.0.0.0 --set web_password=${MITMWEB_PASSWORD:-mitm}
    ports:
      - "${MITMPROXY_PORT:-19004}:8080"   # proxy HTTP(S)
      - "${MITMWEB_UI_PORT:-19003}:8081"  # GUI web (mitmweb)
    volumes:
      - mitmproxy:/home/mitmproxy/.mitmproxy
    networks: [ctfnet]

  zap:
    build:
      context: ./zap
      dockerfile: Dockerfile
    image: ctf-zap
    restart: unless-stopped
    user: zap
    mem_limit: 2g
    cpus: 1.5
    logging: *default-logging
    command: zap-webswing.sh
    ports:
      - "${ZAP_UI_PORT:-19005}:8080"      # GUI web -> http://localhost:19005/zap
      - "${ZAP_PROXY_PORT:-19006}:8090"   # proxy HTTP(S)
    volumes:
      - ./config/zap:/zap/wrk:rw
    profiles: [web]
    networks: [ctfnet]

  # ----------------------------------------------------------------------------- RECON
  spiderfoot:
    image: dtagdevsec/spiderfoot:24.04.1
    restart: unless-stopped
    mem_limit: 1g
    cpus: 1
    logging: *default-logging
    ports:
      - "${SPIDERFOOT_PORT:-19007}:8080"
    volumes:
      - spiderfoot-data:/var/lib/spiderfoot
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/spiderfoot/', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    profiles: [recon]
    networks: [ctfnet]

  # ------------------------------------------------------------------------- FORENSICS
  wireshark:
    image: ghcr.io/linuxserver/wireshark:latest
    restart: unless-stopped
    mem_limit: 2g
    cpus: 1.5
    logging: *default-logging
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-Europe/Rome}
    ports:
      - "${WIRESHARK_HTTP_PORT:-19008}:3000"   # GUI web http
      - "${WIRESHARK_HTTPS_PORT:-19009}:3001"  # GUI web https
    volumes:
      - wireshark-config:/config
    shm_size: "1gb"
    security_opt:
      - seccomp:unconfined
    profiles: [forensics]
    networks: [ctfnet]

  # ----------------------------------------------------------------------------- AUDIO
  # Whisper-WebUI (Gradio): trascrizione audio/video -> testo/SRT con timestamp.
  # Immagine upstream (jhj0517/whisper-webui). Su CPU il default e' `small` e il
  # compute `float32` (config in config/whisper/, copiata all'avvio); i modelli
  # scaricati e gli output restano in ./data/whisper/ (visibili in FileBrowser).
  # NB: serve un tag >= v1.0.8 (torch <= 2.8): `latest` ha torch 2.9 e rompe
  # l'import di pyannote/torchaudio (`AudioMetaData`).
  whisper:
    image: jhj0517/whisper-webui:v1.0.8-4def223
    restart: unless-stopped
    mem_limit: 6g
    cpus: 3
    logging: *default-logging
    entrypoint: ["sh", "-c", "cp -f /opt/whisper/default_parameters.yaml /Whisper-WebUI/configs/default_parameters.yaml && exec python app.py --server_name 0.0.0.0 --server_port 7860 --inbrowser false"]
    ports:
      - "127.0.0.1:${WHISPER_PORT:-19017}:7860"
    volumes:
      - ./config/whisper/default_parameters.yaml:/opt/whisper/default_parameters.yaml:ro
      - ./data/whisper/models:/Whisper-WebUI/models
      - ./data/whisper/outputs:/Whisper-WebUI/outputs
    profiles: [audio]
    networks: [ctfnet]

  # --------------------------------------------------------------------------- UTILITY
  it-tools:
    image: corentinth/it-tools:latest
    restart: unless-stopped
    mem_limit: 128m
    logging: *default-logging
    ports:
      - "${ITTOOLS_PORT:-19011}:80"
    networks: [ctfnet]

  # FileBrowser: browse ./data (progetti StegSuite, estratti, wordlist). Solo localhost.
  # FileBrowser Quantum (fork attivo di filebrowser, che è archiviato).
  # Configurato in noauth: accesso libero, nessun login.
  filebrowser:
    image: gtstef/filebrowser:stable
    restart: unless-stopped
    mem_limit: 512m
    logging: *default-logging
    ports:
      - "127.0.0.1:${FILEBROWSER_PORT:-19012}:80"
    volumes:
      - ./data:/srv
      - ./config/filebrowser/config.yaml:/config/config.yaml:ro
      - filebrowser-data:/home/filebrowser/data
    environment:
      FILEBROWSER_CONFIG: /config/config.yaml
    networks: [ctfnet]

  # StegSuite — stego/forensics workbench (Auto + Check), API-first, own GUI.
  stegsuite:
    build:
      context: .
      dockerfile: app/Dockerfile
    image: ctf-stegsuite
    restart: unless-stopped
    mem_limit: 4g
    cpus: 3
    logging: *default-logging
    ports:
      - "127.0.0.1:${STEGSUITE_PORT:-19014}:19014"
    environment:
      - MAX_DEPTH=${MAX_DEPTH:-6}
      - HEAVY_TOOLS=${HEAVY_TOOLS:-1}
      - API_KEY=${STEGSUITE_API_KEY:-}
      - MAX_UPLOAD_MB=${MAX_UPLOAD_MB:-1024}
      - RATE_LIMIT_RPM=${RATE_LIMIT_RPM:-0}
      - RATE_LIMIT_BURST=${RATE_LIMIT_BURST:-0}
      - RETENTION_DAYS=${RETENTION_DAYS:-0}
      - OCR_LANGS=${OCR_LANGS:-eng}
      - OCR_EXTRA_LANGS=${OCR_EXTRA_LANGS:-ita}
      - OCR_MAX_DIM=${OCR_MAX_DIM:-2200}
      - MAX_WORDLIST_MB=${MAX_WORDLIST_MB:-512}
      - HASHCAT_RULES=${HASHCAT_RULES:-best64}
      - CRACK_BUDGET_S=${CRACK_BUDGET_S:-0}
      - AUTO_CRACK_MAX_MB=${AUTO_CRACK_MAX_MB:-1}
      - AUTO_CRACK_BUDGET_S=${AUTO_CRACK_BUDGET_S:-120}
      - FLAG_PATTERN=${FLAG_PATTERN:-}
    volumes:
      - ./data:/data
      - ./wordlists:/wordlists:ro
    networks: [ctfnet]

  # ------------------------------------------------------------------- CRACK
  # Hashtopolis: distributed hashcat cracking (frontend + backend + MySQL).
  # Gli agent si registrano dalla UI (voucher); non ne avviamo uno di default.
  hashtopolis-db:
    image: mysql:9.7
    restart: unless-stopped
    mem_limit: 1g
    cpus: 1
    logging: *default-logging
    environment:
      MYSQL_ROOT_PASSWORD: ${HASHTOPOLIS_DB_ROOT_PASS:-hashtopolis}
      MYSQL_DATABASE: ${HASHTOPOLIS_DB_NAME:-hashtopolis}
      MYSQL_USER: ${HASHTOPOLIS_DB_USER:-hashtopolis}
      MYSQL_PASSWORD: ${HASHTOPOLIS_DB_PASS:-hashtopolis}
    volumes:
      - hashtopolis-db:/var/lib/mysql
    profiles: [crack]
    networks: [ctfnet]

  hashtopolis-backend:
    image: hashtopolis/backend:latest
    restart: unless-stopped
    mem_limit: 1g
    cpus: 1
    logging: *default-logging
    depends_on: [hashtopolis-db]
    environment:
      HASHTOPOLIS_DB_TYPE: mysql
      HASHTOPOLIS_DB_USER: ${HASHTOPOLIS_DB_USER:-hashtopolis}
      HASHTOPOLIS_DB_PASS: ${HASHTOPOLIS_DB_PASS:-hashtopolis}
      HASHTOPOLIS_DB_HOST: hashtopolis-db
      HASHTOPOLIS_DB_DATABASE: ${HASHTOPOLIS_DB_NAME:-hashtopolis}
      HASHTOPOLIS_ADMIN_USER: ${HASHTOPOLIS_ADMIN_USER:-admin}
      HASHTOPOLIS_ADMIN_PASSWORD: ${HASHTOPOLIS_ADMIN_PASSWORD:-hashtopolis}
      HASHTOPOLIS_BACKEND_URL: ${HASHTOPOLIS_BACKEND_URL:-http://localhost:19015}
      HASHTOPOLIS_FRONTEND_URLS: ${HASHTOPOLIS_FRONTEND_URLS:-http://localhost:19016}
      HASHTOPOLIS_FRONTEND_PORT: ${HASHTOPOLIS_FRONTEND_PORT:-19016}
    volumes:
      - hashtopolis-backend:/usr/local/share/hashtopolis
    ports:
      - "127.0.0.1:${HASHTOPOLIS_BACKEND_PORT:-19015}:80"
    profiles: [crack]
    networks: [ctfnet]

  hashtopolis-frontend:
    image: hashtopolis/frontend:latest
    restart: unless-stopped
    mem_limit: 512m
    cpus: 1
    logging: *default-logging
    depends_on: [hashtopolis-backend]
    environment:
      HASHTOPOLIS_BACKEND_URL: ${HASHTOPOLIS_BACKEND_URL:-http://localhost:19015}
    ports:
      - "127.0.0.1:${HASHTOPOLIS_FRONTEND_PORT:-19016}:80"
    profiles: [crack]
    networks: [ctfnet]

networks:
  ctfnet:
    driver: bridge

volumes:
  sagemath-home:
  mitmproxy:
  spiderfoot-data:
  wireshark-config:
  filebrowser-data:
  hashtopolis-db:
  hashtopolis-backend:

# FileBrowser Quantum — accesso libero (nessun login) sui report del triage.
# https://filebrowserquantum.com/
server:
  port: 80
  baseURL: "/"
  cacheDir: "/home/filebrowser/data/tmp"
  sources:
    - path: "/srv"
      name: "Triage reports"
      config:
        defaultEnabled: true

auth:
  methods:
    noauth: true
  adminUsername: admin
